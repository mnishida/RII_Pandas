[build-system]
requires = ["setuptools", "wheel", "numpy", "Cython", "scipy"]
build-backend = "setuptools.build_meta"

[project]
name = "riip"
version = "0.8.6"
description = "Python 3 + Pandas wrapper for the refractiveindex.info database"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Munehiro Nishida", email = "mnishida@hiroshima-u.ac.jp"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
keywords = ["refractive index", "database", "Pandas"]

dependencies = [
    "numpy>=2.2.3",
    "scipy>=1.13.0",
    "ipython",
    "more_itertools",
    "pandas",
    "pyarrow",
    "matplotlib",
    "tables",
    "pyyaml",
    "gitpython",
]

[project.urls]
Homepage = "https://github.com/mnishida/RII_Pandas"
Repository = "https://github.com/mnishida/RII_Pandas.git"
Issues = "https://github.com/mnishida/RII_Pandas/issues"

[project.optional-dependencies]
dev = [
    "ipykernel",
    "pre-commit",
    "ruff",
]

test = [
    "pytest",
    "pytest-cov",
    "pytest-regressions",
]

typecheck = [
    "pyrefly",
    "pandas-stubs",
]

docs = [
    "nbsphinx",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.setuptools.package-data]
riip = ["py.typed", "data/riid.patch", "data/my_database"]

# ----------------------------------------------------
# Ruff（フォーマッター & リンター）の設定
# ----------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 120 # 1行の最大文字数（Blackの標準に準拠）

[tool.ruff.lint]
# 有効にするルールのカテゴリを指定
select = [
    "E",   # pycodestyle（標準的なスタイル違反）
    "W",   # pycodestyle（警告）
    "F",   # Pyflakes（論理的なバグ・未使用のインポートなど）
    "I",   # isort（インポート文の自動並べ替え）
    "B",   # flake8-bugbear（バグを未然に防ぐルール）
    "UP",  # pyupgrade（古いPython構文を自動で新しくする）
]

# 無視したい特定のルール（必要に応じて追加）
ignore = []

[tool.ruff.lint.isort]
# import文の自動整理で、特定のグループを最上部に固定するなどの設定
combine-as-imports = true

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

# ----------------------------------------------------
# Pyreflyの設定
# ----------------------------------------------------
# 後ほど `pyrefly init` 等のコマンドで設定を生成できます。
