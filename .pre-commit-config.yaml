repos:
  # ----------------------------------------------------
  # 1. Ruff (リモートの公式リポジトリから高速に実行)
  # ----------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19  # 使用したいRuffのバージョンを指定
    hooks:
      # リンターの実行（自動修正も有効化）
      - id: ruff-check
        args: [--fix]
      # フォーマッターの実行（コード整形）
      - id: ruff-format

  # ----------------------------------------------------
  # 2. BasedPyright (ローカルの仮想環境を使って正確に型チェック)
  # ----------------------------------------------------
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        # あなたの環境に合わせて実行コマンドを選んでください
        entry: poetry run basedpyright      # Poetryの場合
        # entry: uv run basedpyright         # uvの場合
        # entry: .venv/bin/basedpyright     # 標準の .venv の場合
        language: system
        types: [python]
        pass_filenames: true
