repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      # - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # ----------------------------------------------------
  # 1. Ruff (リモートの公式リポジトリから高速に実行)
  # ----------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19  # 使用したいRuffのバージョンを指定
    hooks:
      # リンターの実行（自動修正も有効化）
      - id: ruff-check
        args: [--fix]
      # フォーマッターの実行（コード整形）
      - id: ruff-format

  # ----------------------------------------------------
  # 2. Pyrefly (リモートリポジトリから実行)
  # ----------------------------------------------------
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.0.0
    hooks:
      - id: pyrefly-check
        pass_filenames: false
