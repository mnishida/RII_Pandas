{% set pyproject = load_file_data('../pyproject.toml', from_recipe_dir=True) %}
{% set version = pyproject.get('project', {}).get('version', '0.8.6') %}

{% set conda_names = {
    'more_itertools': 'more-itertools',
    'ray': 'ray-default',
    'tables': 'pytables',
} %}

package:
  name: riip
  version: "{{ version }}"

source:
  path: ../

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --ignore-installed"

requirements:
  host:
    - pip
    - python
    - numpy
    - scipy
    - cython
    - setuptools
  run:
    - python
    - {{ pin_compatible('numpy') }}
    # conda-forgeの混入を防ぐため、condaの依存関係から除外するパッケージ
    {% set conda_blacklist = ['pytables', 'tables', 'pytest-regressions'] %}
    {% for dep in pyproject.get('project', {}).get('dependencies', []) %}
      {% set name = dep.split('>=')[0].split('<')[0].split('==')[0].strip() %}
      {% set conda_name = conda_names[name] if name in conda_names else name | replace('_', '-') %}
      {% if conda_name not in conda_blacklist %}
    - {{ conda_name }}
      {% endif %}
    {% endfor %}

test:
  imports:
    - riip

about:
  home: "https://github.com/mnishida/RII_Pandas"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Python 3 + Pandas wrapper for the refractiveindex.info database"
  doc_url: https://github.com/mnishida/RII_Pandas/tree/master/tutorial

extra:
  recipe-maintainers:
    - mnishida
